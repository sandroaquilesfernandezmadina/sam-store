services:

  mysql-category-db:
    image: mysql:8.0
    container_name: mysql-category-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: category_db
    ports:
       - "3308:3306"
    networks:
       - microservices-network
    volumes:
       - mysql-category-data:/var/lib/mysql

  mysql-product-db:
   image: mysql:8.0
   container_name: mysql-product-db
   environment:
     MYSQL_ROOT_PASSWORD: root
     MYSQL_DATABASE: product_db
   ports:
       - "3309:3306"
   networks:
       - microservices-network
   volumes:
       - mysql-product-data:/var/lib/mysql

  config-server-samstore:
       build: ./config-server-samStore
       container_name: config-server-samstore
       ports:
         - "8888:8888"
       networks:
         - microservices-network
       healthcheck:
         test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
         interval: 10s
         timeout: 5s
         retries: 5

  eureka-server-samstore:
         build: ./eureka-server-samStore
         container_name: eureka-server-samstore
         depends_on:
           config-server-samstore:
             condition: service_healthy
         ports:
           - "8761:8761"
         networks:
           - microservices-network


  category-service:
    build: ./category-service
    container_name: category-service
    depends_on:
      config-server-samstore:
        condition: service_healthy
      eureka-server-samstore:
        condition: service_started
      mysql-category-db:
        condition: service_started
    networks:
      - microservices-network

  product-service:
    build: ./product-service
    container_name: product-service
    depends_on:
      config-server-samstore:
        condition: service_healthy
      eureka-server-samstore:
        condition: service_started
      mysql-product-db:
        condition: service_started
    networks:
      - microservices-network

  api-gateway:
    build: ./api-gateway-samStore
    container_name: api-gateway-samstore
    depends_on:
      config-server-samstore:
        condition: service_healthy
      eureka-server-samstore:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  mysql-category-data:
  mysql-product-data:
